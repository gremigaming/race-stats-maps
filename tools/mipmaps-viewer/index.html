<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mipmaps Viewer</title>
<meta name="description" content="Drop F1 25 .mipmaps texture files and view them in 3D. Everything runs in your browser; nothing is uploaded.">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f3; --line:#d9dde3; --text:#1b1f24; --muted:#5d6672;
  --accent:#e10600; --accent-ink:#ffffff; --sel:#fde8e7; --view:#dfe3e8; --chip:#e7eaee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1114; --panel:#171a1f; --panel2:#1e2228; --line:#2a2f37; --text:#e8eaed; --muted:#9aa3ad;
    --accent:#ff2a1f; --accent-ink:#ffffff; --sel:#33191a; --view:#0b0c0e; --chip:#262b33;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1114; --panel:#171a1f; --panel2:#1e2228; --line:#2a2f37; --text:#e8eaed; --muted:#9aa3ad;
  --accent:#ff2a1f; --accent-ink:#ffffff; --sel:#33191a; --view:#0b0c0e; --chip:#262b33;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
header h1 span{color:var(--accent)}
header .hint{color:var(--muted);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
main{flex:1;display:grid;grid-template-columns:260px 1fr 290px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
#list{border-right:1px solid var(--line)}
#side{border-left:1px solid var(--line);padding:12px 14px}
.item{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--sel)}
.item canvas,.item .ph{width:44px;height:44px;border-radius:4px;flex:none;background:var(--chip)}
.item .nm{font-size:13px;word-break:break-all;line-height:1.25}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:11px;padding:0 5px;border-radius:3px;background:var(--chip);color:var(--muted)}
.chip.c{color:#2a7de1}.chip.n{color:#8b5cf6}.chip.s{color:#d97706}.chip.h{color:#059669}.chip.err{color:var(--accent)}
#view{position:relative;background:var(--view);min-width:0;min-height:0;overflow:hidden}
#gl,#flat{position:absolute;inset:0;width:100%;height:100%;display:block}
#flat{display:none;overflow:hidden;cursor:grab;
  background-color:#888;background-image:linear-gradient(45deg,#777 25%,transparent 25%,transparent 75%,#777 75%),linear-gradient(45deg,#777 25%,transparent 25%,transparent 75%,#777 75%);
  background-size:20px 20px;background-position:0 0,10px 10px}
#flat canvas{position:absolute;left:0;top:0;transform-origin:0 0}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;color:var(--muted);padding:24px;pointer-events:none}
#drop b{color:var(--text);font-size:18px}
#drop .box{border:2px dashed var(--line);border-radius:14px;padding:36px 28px;max-width:440px;background:color-mix(in srgb,var(--panel) 70%,transparent)}
body.dragging #drop{display:flex!important;background:color-mix(in srgb,var(--accent) 12%,transparent)}
body.dragging #drop .box{border-color:var(--accent)}
#busy{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--muted);display:none}
#tools{position:absolute;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px;font-weight:600}
h2:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.row label{color:var(--muted);min-width:70px;font-size:13px}
.row select{flex:1;min-width:0}
.map{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--panel2);cursor:pointer}
.map.sel{border-color:var(--accent)}
.map .t{font-size:12px;word-break:break-all;margin-bottom:4px}
.map .meta{font-size:12px;color:var(--muted)}
.kv{font-size:12px;color:var(--muted);margin:4px 0}
.kv b{color:var(--text);font-weight:500}
input[type=range]{flex:1}
.note{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:900px){
  body{overflow:auto}
  main{grid-template-columns:1fr;grid-template-rows:auto 60vh auto}
  #list{border-right:0;border-bottom:1px solid var(--line);max-height:180px}
  #side{border-left:0;border-top:1px solid var(--line)}
  header .hint{display:none}
}
</style>
</head>
<body>
<header>
  <h1>Mipmaps <span>Viewer</span></h1>
  <div class="hint">Drop F1 25 <code>.mipmaps</code> files or a whole <code>textures</code> folder. Everything stays on your computer.</div>
  <button class="primary" id="open">Open files</button>
  <input type="file" id="file" multiple hidden accept=".mipmaps">
</header>
<main>
  <aside id="list"></aside>
  <section id="view">
    <canvas id="gl"></canvas>
    <div id="flat"><canvas id="img"></canvas></div>
    <div id="drop"><div class="box"><b>Drop .mipmaps files here</b><div>Files with the same name (<code>_d</code>, <code>_n</code>, <code>_s</code>…) are combined into one material.<br>You'll find them in <code>F1 25\environment_package\tracks\&lt;track&gt;\objects\textures</code>.</div></div></div>
    <div id="tools">
      <div class="seg"><button id="v3d" class="on">3D</button><button id="v2d">2D</button></div>
    </div>
    <div id="busy"></div>
  </section>
  <aside id="side"></aside>
</main>

<script id="mm-core" type="text/plain">
// ---- .mipmaps core: LZ4 block split + BC1/BC3/BC4/BC5/BC7 decode (runs in a Web Worker) ----
var MM = (function () {
  'use strict';

      if (o >= 64 && (o & (o - 1)) === 0) marks.push(o);
      if (pos + 2 > n) break;
      var off = src[pos] | (src[pos + 1] << 8); pos += 2;
      if (off === 0 || off > o) break;

  function split(src) {
    var marks = lz4Marks(src).sort(function (a, b) { return b - a; });

      var S = marks[mi], pos = 0, lv = [], ok = false;

        var r = lz4(src, pos, S);

  // ---- block decoders write 16 RGBA pixels into px (Uint8Array(64)) ----
  function rgb565(c, a, i) { var r = (c >> 11) & 31, g = (c >> 5) & 63, b = c & 31; a[i] = (r << 3) | (r >> 2); a[i + 1] = (g << 2) | (g >> 4); a[i + 2] = (b << 3) | (b >> 2); }

  var A2 = [15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 15, 2, 8, 2, 2, 8, 8, 15, 2, 8, 2, 2, 8, 8, 2, 2, 15, 15, 6, 8, 2, 8, 15, 15, 2, 8, 2, 2, 2, 15, 15, 6, 6, 2, 6, 8, 15, 15, 2, 2, 15, 15, 15, 15, 15, 2, 2, 15];
