<svg xmlns="http://www.w3.org/2000/svg" viewBox="900 100 100 100" width="1200" height="1200" shape-rendering="geometricPrecision"><defs><filter id="grainGrass" filterUnits="userSpaceOnUse" x="894" y="94" width="112" height="112">
